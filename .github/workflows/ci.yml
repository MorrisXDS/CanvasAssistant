name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # keytar builds against libsecret on Linux
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm install

      # Blocking gate: tsc + vite build must succeed.
      - name: Build
        run: npm run build

      # Blocking gate: lint must pass. Errors fail the build; warnings are allowed.
      # (Lint glob is quoted in package.json so CI and local lint the same file set.)
      - name: Lint
        run: npm run lint

  # NOTE: unit tests and e2e are NOT in CI:
  #  - `tests/` is gitignored (local-only), so a clean CI clone has no test files;
  #    `npm test` can't run here. Un-ignore tests/ (and green the baseline) to re-add it.
  #  - e2e needs a populated local DB, an onboarded OS keychain, and a real Electron window.
  # Run both locally before shipping.
