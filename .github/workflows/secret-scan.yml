# Secret scan — runs gitleaks on every push and PR.
#
# This is the second layer of defense against committing plaintext API keys,
# Canvas tokens, GitHub PATs, etc. The first layer is the local scan in the
# `commit-and-push` skill at C:\Users\ROG\.claude\skills\commit-and-push,
# which runs on `git commit` before the change lands locally. CI here catches
# anything that bypasses the skill (direct `git commit`, different tooling,
# regex blind spots).
#
# This is a private repo, so GitHub's native push-protection isn't available
# without GitHub Advanced Security (paid). Gitleaks-in-CI is the best free
# substitute.
#
# We invoke the gitleaks BINARY directly rather than the gitleaks-action
# wrapper to avoid the wrapper's license-key gating for orgs > 25 users
# (currently irrelevant for solo dev, but the binary is free + unconditional
# and removes any future surprise).
#
# If gitleaks reports a finding the workflow fails with exit code 1 — block
# the PR or push until the secret is rotated and removed from history.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same ref so a fast follow-up push doesn't
  # wastefully spend Actions minutes on the older commit.
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit in the PR/push,
          # not just the tip. A shallow clone would miss leaks introduced
          # earlier in the branch.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.4"
          curl --silent --show-error --location --fail \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: |
          ./gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload SARIF report (only if leaks found)
        if: failure() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-${{ github.run_id }}
          path: gitleaks.sarif
          retention-days: 30
