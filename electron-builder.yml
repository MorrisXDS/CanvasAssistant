appId: com.canvasassistant.app
productName: Canvas Assistant
copyright: Copyright © 2024-2026

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

extraMetadata:
  main: dist/main.js

# Windows
win:
  target:
    - nsis
  icon: assets/app.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/app.ico
  uninstallerIcon: assets/app.ico

# macOS
mac:
  target:
    - dmg
    - zip
  icon: assets/app.iconset
  category: public.app-category.education
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux
linux:
  target:
    - AppImage
    - deb
  icon: assets/app.iconset
  category: Education
  maintainer: Canvas Assistant

deb:
  depends:
    - libsecret-1-0

# Native module rebuild
electronDownload:
  cache: .cache/electron

npmRebuild: true
