appId: com.canvasassistant.app
productName: Canvas Assistant
copyright: Copyright © 2024-2026

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  - node_modules/**/*

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/keytar/**/*

extraResources:
  - from: assets/app.ico
    to: icons/app.ico
  - from: assets/app.iconset/icon_16x16.png
    to: icons/icon_16x16.png
  - from: assets/app.iconset/icon_32x32.png
    to: icons/icon_32x32.png
  - from: assets/app.iconset/icon_16x16_white.png
    to: icons/icon_16x16_white.png
  - from: assets/app.iconset/icon_32x32_white.png
    to: icons/icon_32x32_white.png
  - from: build/uninstall/cleanup.ps1
    to: cleanup.ps1

extraMetadata:
  main: dist/main.js

publish:
  provider: github

# Windows
win:
  target:
    - nsis
  icon: assets/app.iconset/icon_256x256.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# macOS
mac:
  target:
    - dmg
    - zip
  icon: assets/app.iconset/icon_512x512.png
  category: public.app-category.education
  identity: null

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux
linux:
  target:
    - AppImage
    - deb
  icon: assets/app.iconset/icon_512x512.png
  category: Education
  maintainer: Canvas Assistant

deb:
  depends:
    - libsecret-1-0
  # ADR-0014: the npm `name` rename canvas-integration-dashboard -> canvas-assistant
  # changes the derived .deb package name. apt treats the two names as DISTINCT
  # packages, so installing the new one over an old install would leave TWO packages
  # / two /opt dirs. Replaces+Conflicts make canvas-assistant cleanly supersede the
  # old package (old /opt removed by its prerm); Provides lets anything depending on
  # the old name resolve to the new (defensive). Passed verbatim to fpm
  # (app-builder-lib fpm.js: `use(options.fpm, it => args.push(...it))`).
  fpm:
    - "--replaces=canvas-integration-dashboard"
    - "--conflicts=canvas-integration-dashboard"
    - "--provides=canvas-integration-dashboard"

# Native module rebuild
electronDownload:
  cache: .cache/electron

npmRebuild: true

afterPack: build/afterPack.cjs
